name: docker

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_NAME: cnes/sentinel2_superresolution

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Extract X.Y.Z from git tag (v1.2.3 -> 1.2.3)
        id: vars
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Build docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test run docker image
        run: |
          docker run --rm ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }} python /app/run.py --help
      
      - name: Login on dockerhub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max